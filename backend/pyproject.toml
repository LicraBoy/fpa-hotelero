[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # acentos y símbolos en español son válidos
    "B008",                        # Depends(...) en argumentos es el patrón de FastAPI
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S108"]
"migraciones/*" = ["E501"]
"fpa/mapeo_*.py" = ["E501"]
"scripts/*" = ["S101"]

[tool.mypy]
strict = true
files = ["fpa"]
python_version = "3.13"

[[tool.mypy.overrides]]
module = ["xlrd", "xlrd.*", "xlwt", "xlwt.*", "clamd", "clamd.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
